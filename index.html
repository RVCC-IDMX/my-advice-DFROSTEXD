<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Should I Watch?</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header>
      <h1>🎬 What Should I Watch?</h1>
      <p>Find your next favorite movie or TV show based on your preferences</p>
    </header>

    <main>
      <section class="preferences-section">
        <h2>What are you in the mood for?</h2>
        <form id="preferences-form">
          <div class="form-group">
            <label for="movie-request">Describe what you want to watch</label>
            <textarea
              id="movie-request"
              name="movie-request"
              rows="4"
              placeholder="Try: 'upbeat 90s comedies under 100 minutes' or 'intense sci-fi thrillers from the 2000s'"
              maxlength="500"
              required
            ></textarea>
            <small>Max 500 characters</small>
          </div>

          <button type="submit">Find Movies</button>
        </form>
      </section>

      <section class="results-section">
        <h2>Recommendations</h2>
        <div id="results-container"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 What Should I Watch?</p>
    </footer>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
